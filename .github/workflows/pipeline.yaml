name: Purge Workflow CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: purge-workflow
  CONTAINER_NAME: purge-workflow
  ECS_CLUSTER: purge-cluster
  ECS_SERVICE: purge-service
  ECS_TASK_DEFINITION: ecs-task-definition.json

jobs:

###############################################################################
# Validate + Unit Tests
###############################################################################

  validate-unit-tests:
    name: Validate and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm ci

      - name: Validate
        run: npm ci --dry-run

      - name: Run Unit Tests
        run: npm test -- --coverage

###############################################################################
# Build Image or Lambda Packages
###############################################################################

  build-artifacts:
    name: Build Image or Lambda Packages
    runs-on: ubuntu-latest
    needs: validate-unit-tests

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # Build Lambda Package
      - name: Package Lambda
        run: |
          mkdir -p artifacts
          zip -r artifacts/purge-lambda.zip .

      - name: Upload Lambda Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: artifacts/purge-lambda.zip

      # Build Docker Image
      - name: Build Docker Image
        run: |
          docker build \
            -f Dockerfile \
            -t ${CONTAINER_NAME}:${{ github.sha }} .

###############################################################################
# Scan Artifacts
###############################################################################

  scan-artifacts:
    name: Scan Artifacts
    runs-on: ubuntu-latest
    needs: build-artifacts

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -f Dockerfile \
            -t ${CONTAINER_NAME}:${{ github.sha }} .

      #########################################################################
      # Generate SBOM
      #########################################################################

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.CONTAINER_NAME }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: sbom.json

      #########################################################################
      # Prisma Cloud Scan
      #########################################################################

      - name: Download TwistCLI
        run: |
          curl -k \
          -u "${{ secrets.PRISMA_ACCESS_KEY }}:${{ secrets.PRISMA_SECRET_KEY }}" \
          "https://${{ secrets.PRISMA_CONSOLE_URL }}/api/v1/util/twistcli" \
          --output twistcli

          chmod +x twistcli

      - name: Scan Container
        run: |
          ./twistcli images scan \
            --address https://${{ secrets.PRISMA_CONSOLE_URL }} \
            --user "${{ secrets.PRISMA_ACCESS_KEY }}" \
            --password "${{ secrets.PRISMA_SECRET_KEY }}" \
            ${CONTAINER_NAME}:${{ github.sha }}

###############################################################################
# Publish Artifacts
###############################################################################

  publish-artifacts:
    name: Publish Artifacts
    runs-on: ubuntu-latest
    needs: scan-artifacts

    outputs:
      image_uri: ${{ steps.export.outputs.image_uri }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login To ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -f Dockerfile \
            -t ${CONTAINER_NAME}:${{ github.sha }} .

      - name: Tag Image
        run: |
          docker tag \
          ${CONTAINER_NAME}:${{ github.sha }} \
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Push Image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Export Image URI
        id: export
        run: |
          echo "image_uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

###############################################################################
# Deploy Deletion / Purge Workflow
###############################################################################

  deploy-purge-workflow:
    name: Deploy Deletion Purge Workflow
    runs-on: ubuntu-latest
    needs: publish-artifacts

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render ECS Task Definition
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.publish-artifacts.outputs.image_uri }}

      - name: Deploy ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

###############################################################################
# Smoke Test
###############################################################################

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy-purge-workflow

    steps:
      - name: Validate Endpoint
        run: |
          APP_URL=https://your-domain.com/health

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL")

          if [ "$STATUS" != "200" ]; then
            echo "Smoke Test Failed"
            exit 1
          fi

          echo "Smoke Test Passed"
